name: SauceDemo Cypress Automation

on:
  push:
    branches: [main, feature/**]
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # daily smoke run against the live site

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: 07-outputs/Automation-Cypress/Framework
          install-command: npm install
          command: npm run test:smoke
        env:
          CYPRESS_BASE_URL: https://www.saucedemo.com/
      - name: Upload mochawesome report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: 07-outputs/Automation-Cypress/Framework/cypress/reports/mochawesome

  regression:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Run regression suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: 07-outputs/Automation-Cypress/Framework
          install-command: npm install
          command: npm run test:regression
        env:
          CYPRESS_BASE_URL: https://www.saucedemo.com/
      - name: Upload mochawesome report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: 07-outputs/Automation-Cypress/Framework/cypress/reports/mochawesome
