name: 'Email Notification'
description: 'Sends the HTML run summary via SMTP'
inputs:
  summary-file:
    required: true
  smtp-host:
    required: true
  smtp-user:
    required: true
  smtp-password:
    required: true
runs:
  using: 'composite'
  steps:
    - name: Send run summary email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp-host }}
        username: ${{ inputs.smtp-user }}
        password: ${{ inputs.smtp-password }}
        subject: 'SauceDemo Automation Run Summary'
        to: ${{ inputs.smtp-user }}
        from: SauceDemo Automation
        html_body: file://${{ inputs.summary-file }}
