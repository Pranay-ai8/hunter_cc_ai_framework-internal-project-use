name: SauceDemo Selenium Automation

on:
  push:
    branches: [main, feature/**]
  pull_request:
  schedule:
    # Recurring smoke run — SauceDemo "may be updated without notice" per
    # GapAnalysis.md; catches locator/behavior drift early.
    - cron: '0 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run smoke suite (headless Chrome)
        working-directory: 07-outputs/Automation-Selenium/Framework
        run: mvn -B clean test -Dsurefire.suiteXmlFiles=config/testng_smoke.xml -Denv=prd -Dbrowser=${{ matrix.browser }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: 07-outputs/Automation-Selenium/Framework/test-output/

  regression:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run regression suite (headless Chrome)
        working-directory: 07-outputs/Automation-Selenium/Framework
        run: mvn -B clean test -Dsurefire.suiteXmlFiles=config/testng_regression.xml -Denv=prd -Dbrowser=chrome

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-regression
          path: 07-outputs/Automation-Selenium/Framework/test-output/
