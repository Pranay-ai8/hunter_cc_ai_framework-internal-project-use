name: SauceDemo Playwright Suite

on:
  push:
    paths:
      - '07-outputs/Automation/Framework/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-outputs/Automation/Framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: 07-outputs/Automation/Framework/reports/
