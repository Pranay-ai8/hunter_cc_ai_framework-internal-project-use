PROXY=false
SeverAddress=http://0.0.0.0:4723

# NoReset=true: app data (incl. the devmode-trigger's SharedPreferences-backed backend-URL setting)
# persists across every driver session in a suite run, so EnvironmentSetup's one-time switch to the
# Test backend (see testng/SuiteCreationListener.onStart -> utils/EnvironmentSetup) survives into every
# later @Test method's own session instead of being wiped by Appium's default app-data reset.
NoReset=true

# AndroidUDID - OPTIONAL. Leave blank/commented to auto-detect the single connected device/emulator
# (DeviceConfig fails fast if zero or more than one are ready - see its class javadoc). Set this
# explicitly only when more than one device/emulator may legitimately be attached at once, to avoid an
# ambiguous auto-detection failure.
# AndroidUDID=

# BatteryCriticalThresholdPercent - OPTIONAL, default 5. TestBase checks the target device's battery
# level before every @Test method (utils/BatteryGuard) and aborts the run cleanly if it is at or below
# this threshold, rather than risking losing mid-test state to an unplanned power-off on real hardware.
# Not meaningful for emulators (always report 100%/unlimited) but harmless to leave on.
BatteryCriticalThresholdPercent=3

# --- Mail APIs (utils/MailApi/*) - OPTIONAL, only needed if OTP email-retrieval test cases are
# un-TBD'd later (see FunctionalTestCases.md Section 4.3 / GapAnalysis.md GAP-ENV-01: the
# test-mailbox/automation-environment capability for OTP flows is currently UNCONFIRMED for this
# project). Left blank/commented here deliberately - do not fabricate values.
